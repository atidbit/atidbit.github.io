# AI News daily roundup data.
# The page shows the latest 7 day entries (newest first). Older days stay in this
# file so they can be reused later; they simply drop off /ai/.
#
# Daily run (see also DAILY-RUNBOOK.md in the work folder):
#   1. Find 5–10 real AI stories from the past ~24 hours. Skip any URL already
#      in this file. Use each article’s official publish date, not the time of
#      the run. Do not invent stories, quotes, or numbers.
#   2. Verify every item.url returns HTTP 200.
#   3. Save each story’s og:image into ai/images/2026/ as a ~480px-wide
#      compressed JPEG. If there is no usable image, omit `image` to use the
#      maroon “AI NEWS” placeholder.
#   4. Prepend a new day object under `days:` (newest first) with a heading
#      like “Wednesday, Nov 25, 2026”, a short summary, and category sections.
#   5. Run:  python3 /workspace/webdesign-work/atidbit-ai-2026-11-25/generate.py
#   6. Run the sensitive-info check (no secrets, keys, or personal details).
#   7. Follow DAILY-RUNBOOK.md to commit, export a patch, and publish.
#
# Headlines and summaries are short paraphrases; every item.url must be a
# verified original-article link.

site_name: AI News
tagline: DAILY ROUNDUP OF AI NEWS
lede: >
  The day's most important AI stories from original sources. Each item has a
  short summary and a link to the full article.
canonical: https://atidbit.io/ai/
visible_days: 7

days:
  - id: 2026-11-25
    heading: "Wednesday, Nov 25, 2026"
    summary: >
      Google DeepMind released Mass Spec Skills for Antigravity, and Google
      Research open-sourced a framework for testing how well assistants infer
      motives from a user’s account of events.
    sections:
      - label: Research
        pill: Research
        items:
          - title: "DeepMind adds Mass Spec Skills so Antigravity can identify molecules"
            source: Google DeepMind
            url: https://deepmind.google/blog/interpreting-mass-spectra-with-google-antigravity/
            date: 2026-11-25
            summary: "On 100 catalogued compounds, adding the skills raised exact-molecule identification to about 97% across three Gemini models, DeepMind says."
            image: /ai/images/2026/mass-spec-skills-antigravity.jpg
            image_alt: "Title card reading Identifying molecules with Mass Spec Skills for Google Antigravity"

          - title: "Google Research open-sources a test of social reasoning in AI assistants"
            source: Google Research
            url: https://research.google/blog/verifiable-social-reasoning-for-llm-assistants/
            date: 2026-11-25
            summary: "The framework uses multi-agent simulations with a hidden motive and a 20,000-example dataset to test what an assistant can infer from a user’s story."
            image: /ai/images/2026/verifiable-social-reasoning.jpg
            image_alt: "Google Research wordmark with a collage of research imagery"

  - id: 2026-11-24
